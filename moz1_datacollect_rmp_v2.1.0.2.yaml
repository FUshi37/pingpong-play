system:
  standardparam_version: moz1_datacollect_rmp_v2.1.0.2 
  link_variants:
    MOVEBASE: "standard"            # standard(标准底盘) | v2_1base(v2.1小底盘)
    TORSO: "standard"               # standard(标准躯干) | v2_1base(v2.1小底盘躯干)
  driver_system:
    # 是否检测伺服是否丢零点
    is_check_servo_zero: true            
motion:
  motion_config:
    # 笛卡尔空间插补的轴角度的一阶滤波系数
    cart_jnt_filter_scale: 1.0
    enable_wbrmp_planner: true
workpoint:
  workpoint_config:
    work_points:
      VRMOV:
        LeftArm: [-9, -50, -20, -90, -35, 8, -7]
        LegWaist: [0, 60, -90, 30, 0, 0]
        RightArm: [9, -50, 20, 90, 35, 8, 7]
      VR:
        LeftArm: [-9, -50, -20, -90, -35, 8, -7]
        LegWaist: [30, 0, 0, 30, 0, 0]
        RightArm: [9, -50, 20, 90, 35, 8, 7]

