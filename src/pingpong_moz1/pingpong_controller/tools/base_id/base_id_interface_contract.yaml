# MOZ1 Base Dynamics Identification Interface Contract
# Generated by inspect_base_interface.py (read-only audit).
# Fill every UNRESOLVED_REQUIRE_OPERATOR_FILL entry (or pass --set overrides)
# before running run_base_id_experiment.py.

schema_version: moz1_base_id_contract_v1
ros:
  domain_id: 33
  robot_host: 172.16.0.20
base_command:
  protocol: mech_unit_value_array
  topic: /mx_base_cmd
  msg_type: mc_core_interface/msg/MechUnitValueArray
  qos_reliability: best_effort
  mech_unit_name: base
  mode: 1
  frame_type: 0
  field_mapping:
    vx_m_s: cartesian.twist.linear.x
    vy_m_s: cartesian.twist.linear.y
    wz_rad_s: cartesian.twist.angular.z
  publish_rate_hz: 50.0
  zero_brake_rate_hz: 50.0
  zero_brake_min_duration_s: 0.5
  allow_existing_publishers: false
base_feedback:
  primary_topic: /mx_robot_state
  primary_msg_type: mc_core_interface/msg/MechUnitValueArray
  secondary_joint_topic: /joint_states
  secondary_joint_msg_type: sensor_msgs/msg/JointState
  robot_status_topic: /robot_states
  robot_status_msg_type: mc_core_interface/msg/RobotStatus
  servo_feedback_topic: /servo_data_msg
  servo_feedback_msg_type: mc_core_interface/msg/ServoFeedback
  mech_unit_name: base
  base_mu_idx: 0
  wheel_joints:
  - Base-0
  - Base-1
  - Base-2
  - Base-3
  base_pose_source: integrate_base_twist
  expected_kinematic_type: omnidirectional_4wheel
  wheel_half_xy_m:
  - 0.2423
  - 0.2423
imu_feedback:
  topic: /imu_states
  msg_type: geometry_msgs/msg/Vector3Stamped
  required: false
  angle_unit: rad
arm_feedback:
  primary_topic: /mx_robot_state
  primary_msg_type: mc_core_interface/msg/MechUnitValueArray
  secondary_joint_topic: /joint_states
  mech_unit_name: right_arm
  right_arm_mu_idx: 3
  joint_names:
  - RightArm-0
  - RightArm-1
  - RightArm-2
  - RightArm-3
  - RightArm-4
  - RightArm-5
  - RightArm-6
  fk_model_xml: src/pingpong_moz1/pingpong_controller/models/moz1_pd.xml
  fk_ee_site: right_ee_site
  fk_racket_normal_axis_index: 2
arm_concurrency_command:
  protocol: mech_unit_value_array
  topic: /mx_robot_cmd
  msg_type: mc_core_interface/msg/MechUnitValueArray
  qos_reliability: best_effort
  mech_unit_name: right_arm
  mode: 0
  right_arm_mu_idx: 3
  publish_rate_hz: 200.0
  hold_mode: latched_current_pose
  max_joint_delta_rad: 0.05
  max_micro_sine_amp_rad: 0.02
mocap:
  enabled: true
  base_track_mode: rigid_body
  bind_host: 0.0.0.0
  udp_port: 65501
  calibration_path: mocap_calibration_auto.txt
  position_unit: auto
  timestamp_unit: s
  timeout_s: 0.5
  abort_on_dropout: false
  base_rigid_body_id: null
  base_rigid_body_slot: null
  base_rigid_body_name: null
  base_rigid_body_observation_bounds_m:
  - null
  - - 0.05
    - 0.6
  - null
  base_lever_arm_xy_m:
  - 0.0
  - 0.0
  base_marker_id: null
  base_marker_observation_bounds_m: null
  racket_rigid_body_id: null
  racket_rigid_body_slot: null
  racket_rigid_body_name: null
operator_site_verification:
  base_frame_id: base_link
  arm_mount_frame_id: waist03
  base_plus_x_physical_direction: forward
  base_plus_y_physical_direction: left
  base_plus_yaw_ccw_from_top_verified: true
  controller_base_vel_override_verified: 1.0
  teleop_publisher_conflict_cleared: true
safety:
  geofence_radius_m: 0.6
  geofence_yaw_rad: 3.5
  feedback_stale_timeout_s: 0.1
  stop_vel_eps_m_s: 0.01
  stop_yaw_rate_eps_rad_s: 0.02
  brake_max_wait_s: 3.0
  require_robot_status_normal: true
  require_base_motor_power_on: true
  require_target_tracking_mode: true
  require_legwaist_impedance_mode: true
  legwaist_mu_idx: 1
  apply_command_slew_clamp: false
  tier_limits:
    low:
      v_max_m_s: 0.2
      w_max_rad_s: 0.3
      a_max_m_s2: 0.8
      alpha_max_rad_s2: 1.2
      max_disp_m: 0.2
    med:
      v_max_m_s: 0.35
      w_max_rad_s: 0.55
      a_max_m_s2: 1.2
      alpha_max_rad_s2: 2.0
      max_disp_m: 0.3
    high:
      v_max_m_s: 0.45
      w_max_rad_s: 0.8
      a_max_m_s2: 1.8
      alpha_max_rad_s2: 3.0
      max_disp_m: 0.35
